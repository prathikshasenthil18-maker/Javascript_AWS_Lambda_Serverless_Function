AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Scenario 1 Monolithic AWS Lambda — Version_16 (Customer Version 16)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs16.x

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: js-lambda-cv-16
      CodeUri: dist/
      Handler: handler.handler
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY
